<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif"><rect width="1600" height="680" fill="#FFFFFF"/><defs><marker id="a4A5261" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5261"/></marker><marker id="a1F6B78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6B78"/></marker></defs><rect x="40" y="40" width="250" height="165" rx="8" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="1.2"/><text x="56" y="56.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">How many agents? One.</text><text x="56" y="80.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">Ami, the support agent:</text><text x="56" y="104.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">one LLM, two planner</text><text x="56" y="128.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">strategies, seven tools.</text><text x="56" y="152.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">The LLM judge used in</text><text x="56" y="176.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">testing is a grader, not</text><text x="56" y="200.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">an agent.</text><rect x="40" y="230" width="250" height="130" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="165" y="271" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Customer</text><text x="165" y="299" font-size="19" fill="#15202B" text-anchor="middle">Browser chat UI</text><text x="165" y="321" font-size="19" fill="#15202B" text-anchor="middle">Log in · Agent internals panel</text><text x="165" y="343" font-size="19" fill="#15202B" text-anchor="middle">Thumbs up / down</text><rect x="40" y="440" width="250" height="150" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="165" y="491" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Support staff</text><text x="165" y="519" font-size="19" fill="#15202B" text-anchor="middle">/logs dashboard:</text><text x="165" y="541" font-size="19" fill="#15202B" text-anchor="middle">cost, latency, alerts, events</text><text x="165" y="563" font-size="19" fill="#15202B" text-anchor="middle">Ticket queue in Jira</text><rect x="350" y="170" width="260" height="300" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="480" y="263" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Web server</text><text x="480" y="291" font-size="19" fill="#15202B" text-anchor="middle">web.py, plain Python HTTP</text><text x="480" y="313" font-size="19" fill="#15202B" text-anchor="middle"></text><text x="480" y="335" font-size="19" fill="#15202B" text-anchor="middle">Login → signed JWT, scope =</text><text x="480" y="357" font-size="19" fill="#15202B" text-anchor="middle">this customer only</text><text x="480" y="379" font-size="19" fill="#15202B" text-anchor="middle">Rate limit · audit log</text><text x="480" y="401" font-size="19" fill="#15202B" text-anchor="middle">Sessions · feedback</text><rect x="670" y="40" width="480" height="600" rx="14" fill="#F2F0EA" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="686" y="68" font-size="21" fill="#4A5261" font-weight="bold" text-anchor="start">AI agent core: Ami, the one agent</text><rect x="700" y="85" width="420" height="70" rx="12" fill="#A8560A" stroke="#A8560A" stroke-width="1.6"/><text x="910" y="118" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Policy layer</text><text x="910" y="146" font-size="19" fill="#FBE9D2" text-anchor="middle">check_input · guarded_run · check_output</text><rect x="700" y="185" width="230" height="125" rx="12" fill="#1E2C3A" stroke="#1E2C3A" stroke-width="1.6"/><text x="815" y="223.5" font-size="24" fill="#F6F4EE" font-weight="bold" text-anchor="middle">Planner, ReAct</text><text x="815" y="251.5" font-size="19" fill="#C9D1D9" text-anchor="middle">Thought → Action →</text><text x="815" y="273.5" font-size="19" fill="#C9D1D9" text-anchor="middle">Observation, ≤ 6 steps</text><text x="815" y="295.5" font-size="19" fill="#C9D1D9" text-anchor="middle">(plan-and-execute alt.)</text><rect x="955" y="185" width="165" height="125" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1037.5" y="212.5" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Memory</text><text x="1037.5" y="240.5" font-size="19" fill="#15202B" text-anchor="middle">conversation</text><text x="1037.5" y="262.5" font-size="19" fill="#15202B" text-anchor="middle">working</text><text x="1037.5" y="284.5" font-size="19" fill="#15202B" text-anchor="middle">long-term</text><text x="1037.5" y="306.5" font-size="19" fill="#15202B" text-anchor="middle">answer cache</text><rect x="700" y="340" width="420" height="95" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="910" y="374.5" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Tools (7), guardrails inside</text><text x="910" y="402.5" font-size="19" fill="#15202B" text-anchor="middle">find / get orders · track · cancel · return</text><text x="910" y="424.5" font-size="19" fill="#15202B" text-anchor="middle">search_knowledge · escalate</text><rect x="700" y="460" width="230" height="70" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="815" y="493" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Profile</text><text x="815" y="521" font-size="19" fill="#15202B" text-anchor="middle">the system prompt: who Ami is</text><rect x="955" y="460" width="165" height="70" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1037.5" y="493" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Model router</text><text x="1037.5" y="521" font-size="19" fill="#15202B" text-anchor="middle">easy → cheap tier</text><rect x="700" y="555" width="420" height="65" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="910" y="585.5" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Observability</text><text x="910" y="613.5" font-size="19" fill="#15202B" text-anchor="middle">every call, tool and turn: tokens, cost, latency → alerts</text><rect x="1220" y="55" width="340" height="110" rx="12" fill="#1E2C3A" stroke="#1E2C3A" stroke-width="1.6"/><text x="1390" y="86" font-size="24" fill="#F6F4EE" font-weight="bold" text-anchor="middle">LLM</text><text x="1390" y="114" font-size="19" fill="#C9D1D9" text-anchor="middle">gpt-5.6-terra through an</text><text x="1390" y="136" font-size="19" fill="#C9D1D9" text-anchor="middle">OpenAI-compatible API:</text><text x="1390" y="158" font-size="19" fill="#C9D1D9" text-anchor="middle">chat completions + function calling</text><rect x="1220" y="200" width="340" height="120" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1390" y="236" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Knowledge base (RAG)</text><text x="1390" y="264" font-size="19" fill="#15202B" text-anchor="middle">15 policy documents → chunks →</text><text x="1390" y="286" font-size="19" fill="#15202B" text-anchor="middle">local embeddings (bge-micro-v2)</text><text x="1390" y="308" font-size="19" fill="#15202B" text-anchor="middle">→ ChromaDB vector index</text><rect x="1220" y="355" width="340" height="75" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1390" y="390.5" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Order store</text><text x="1390" y="418.5" font-size="19" fill="#15202B" text-anchor="middle">orders and customers, scope-filtered</text><rect x="1220" y="465" width="340" height="155" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1390" y="507.5" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Hand-off to humans</text><text x="1390" y="535.5" font-size="19" fill="#15202B" text-anchor="middle">ESC / CXL / RMA tickets</text><text x="1390" y="557.5" font-size="19" fill="#15202B" text-anchor="middle">→ escalation matrix: department,</text><text x="1390" y="579.5" font-size="19" fill="#15202B" text-anchor="middle">priority, SLA, next steps</text><text x="1390" y="601.5" font-size="19" fill="#15202B" text-anchor="middle">→ Jira · webhook · email</text><path d="M290,295 L350,295" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M610,295 L670,295" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M930,247 L955,247" fill="none" stroke="#4A5261" stroke-width="2.2"/><path d="M1120,120 L1220,120" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)" marker-start="url(#a4A5261)"/><path d="M1120,370 L1220,370" fill="none" stroke="#4A5261" stroke-width="2.2"/><path d="M1170,370 L1170,260 L1220,260" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1170,370 L1170,392 L1220,392" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1170,370 L1170,540 L1220,540" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1390,620 L1390,655 L165,655 L165,590" fill="none" stroke="#1F6B78" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a1F6B78)"/><text x="700" y="672" font-size="16" fill="#1F6B78" text-anchor="middle" font-style="italic">ticket reaches a person</text><path d="M700,587 L620,587 L620,515 L290,515" fill="none" stroke="#1F6B78" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a1F6B78)"/><path d="M815,155 L815,185" fill="none" stroke="#4A5261" stroke-width="2.2"/><path d="M815,310 L815,340" fill="none" stroke="#4A5261" stroke-width="2.2"/><path d="M1037,310 L1037,340" fill="none" stroke="#4A5261" stroke-width="2.2"/></svg>