<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif"><rect width="1600" height="680" fill="#FFFFFF"/><defs><marker id="a4A5261" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5261"/></marker><marker id="a1F6B78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6B78"/></marker></defs><rect x="40" y="40" width="1520" height="200" rx="14" fill="#F2F0EA" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="56" y="68" font-size="21" fill="#4A5261" font-weight="bold" text-anchor="start">Indexing: once, and again whenever a document changes</text><rect x="70" y="85" width="330" height="130" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="235" y="126" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">15 written documents</text><text x="235" y="154" font-size="19" fill="#15202B" text-anchor="middle">policies · rules · tone · regulations</text><text x="235" y="176" font-size="19" fill="#15202B" text-anchor="middle">(returns, cancellations, shipping,</text><text x="235" y="198" font-size="19" fill="#15202B" text-anchor="middle">refunds, gift cards, privacy …)</text><rect x="450" y="85" width="290" height="130" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="595" y="126" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Chunk at headings</text><text x="595" y="154" font-size="19" fill="#15202B" text-anchor="middle">about 48 chunks, each</text><text x="595" y="176" font-size="19" fill="#15202B" text-anchor="middle">labelled with its document</text><text x="595" y="198" font-size="19" fill="#15202B" text-anchor="middle">and category</text><rect x="790" y="85" width="320" height="130" rx="12" fill="#1E2C3A" stroke="#1E2C3A" stroke-width="1.6"/><text x="950" y="126" font-size="24" fill="#F6F4EE" font-weight="bold" text-anchor="middle">Embed locally</text><text x="950" y="154" font-size="19" fill="#C9D1D9" text-anchor="middle">bge-micro-v2, 17 MB, int8,</text><text x="950" y="176" font-size="19" fill="#C9D1D9" text-anchor="middle">runs on the server, no API cost;</text><text x="950" y="198" font-size="19" fill="#C9D1D9" text-anchor="middle">384 numbers per chunk</text><rect x="1160" y="85" width="370" height="130" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="1345" y="126" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">ChromaDB vector index</text><text x="1345" y="154" font-size="19" fill="#15202B" text-anchor="middle">nearest-neighbour search;</text><text x="1345" y="176" font-size="19" fill="#15202B" text-anchor="middle">rebuilt automatically when</text><text x="1345" y="198" font-size="19" fill="#15202B" text-anchor="middle">the documents change</text><rect x="40" y="300" width="1520" height="200" rx="14" fill="#F2F0EA" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="56" y="328" font-size="21" fill="#4A5261" font-weight="bold" text-anchor="start">Answering: every policy question, every time</text><rect x="70" y="345" width="250" height="130" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="195" y="397" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Customer question</text><text x="195" y="425" font-size="19" fill="#15202B" text-anchor="middle">"What is your return</text><text x="195" y="447" font-size="19" fill="#15202B" text-anchor="middle">policy?"</text><rect x="360" y="345" width="250" height="130" rx="12" fill="#1E2C3A" stroke="#1E2C3A" stroke-width="1.6"/><text x="485" y="397" font-size="24" fill="#F6F4EE" font-weight="bold" text-anchor="middle">Embed the question</text><text x="485" y="425" font-size="19" fill="#C9D1D9" text-anchor="middle">same local model,</text><text x="485" y="447" font-size="19" fill="#C9D1D9" text-anchor="middle">same 384 numbers</text><rect x="650" y="345" width="270" height="130" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="785" y="386" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Nearest chunks</text><text x="785" y="414" font-size="19" fill="#15202B" text-anchor="middle">the passages whose</text><text x="785" y="436" font-size="19" fill="#15202B" text-anchor="middle">numbers are closest</text><text x="785" y="458" font-size="19" fill="#15202B" text-anchor="middle">(search_knowledge tool)</text><rect x="960" y="345" width="270" height="130" rx="12" fill="#A8560A" stroke="#A8560A" stroke-width="1.6"/><text x="1095" y="397" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">LLM reads evidence</text><text x="1095" y="425" font-size="19" fill="#FBE9D2" text-anchor="middle">prompt = question +</text><text x="1095" y="447" font-size="19" fill="#FBE9D2" text-anchor="middle">retrieved passages</text><rect x="1270" y="345" width="260" height="130" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="1400" y="397" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Answer</text><text x="1400" y="425" font-size="19" fill="#15202B" text-anchor="middle">quotes the written rule,</text><text x="1400" y="447" font-size="19" fill="#15202B" text-anchor="middle">not the model's memory</text><rect x="40" y="545" width="740" height="105" rx="8" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="1.2"/><text x="56" y="591.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">If the knowledge store is unavailable, the tool returns nothing and the agent says</text><text x="56" y="615.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">"I can't look that up right now" — it never invents a policy.</text><rect x="820" y="545" width="740" height="105" rx="8" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="1.2"/><text x="836" y="579.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">Delivery problems ("says delivered but not here", "tracking hasn't moved") look</text><text x="836" y="603.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">the policy up before the first model call:</text><text x="836" y="627.5" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">16 → 9 model calls, median turn 4.9 s → 2.1 s.</text><path d="M400,150 L450,150" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M740,150 L790,150" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1110,150 L1160,150" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M320,410 L360,410" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M610,410 L650,410" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M920,410 L960,410" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1230,410 L1270,410" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1345,215 L1345,270 L785,270 L785,345" fill="none" stroke="#1F6B78" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a1F6B78)"/><text x="1070" y="262" font-size="16" fill="#1F6B78" text-anchor="middle" font-style="italic">search</text></svg>