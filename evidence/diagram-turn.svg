<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif"><rect width="1600" height="680" fill="#FFFFFF"/><defs><marker id="a4A5261" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5261"/></marker><marker id="a1F6B78" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6B78"/></marker></defs><rect x="40" y="40" width="210" height="90" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="145" y="83" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Customer message</text><text x="145" y="111" font-size="19" fill="#15202B" text-anchor="middle">typed in the chat</text><rect x="290" y="40" width="210" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="395" y="72" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">1 · Input policy</text><text x="395" y="100" font-size="19" fill="#15202B" text-anchor="middle">scrub card numbers,</text><text x="395" y="122" font-size="19" fill="#15202B" text-anchor="middle">flag override attempts</text><rect x="540" y="40" width="210" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="645" y="72" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">2 · Classify</text><text x="645" y="100" font-size="19" fill="#15202B" text-anchor="middle">PUBLIC (policy) or</text><text x="645" y="122" font-size="19" fill="#15202B" text-anchor="middle">PRIVATE (account)</text><rect x="790" y="40" width="210" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="895" y="72" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">3 · Gate and cache</text><text x="895" y="100" font-size="19" fill="#15202B" text-anchor="middle">login required?</text><text x="895" y="122" font-size="19" fill="#15202B" text-anchor="middle">cached answer?</text><rect x="1040" y="40" width="210" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1145" y="72" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">4 · Model routing</text><text x="1145" y="100" font-size="19" fill="#15202B" text-anchor="middle">easy → cheap tier,</text><text x="1145" y="122" font-size="19" fill="#15202B" text-anchor="middle">hard → strong</text><rect x="1290" y="40" width="270" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1425" y="72" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">5 · Memory and prefetch</text><text x="1425" y="100" font-size="19" fill="#15202B" text-anchor="middle">long-term memory read,</text><text x="1425" y="122" font-size="19" fill="#15202B" text-anchor="middle">orders loaded on login</text><rect x="540" y="225" width="1020" height="215" rx="14" fill="#F2F0EA" stroke="#C9C4B8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="556" y="253" font-size="21" fill="#4A5261" font-weight="bold" text-anchor="start">6 · The ReAct loop, up to six steps</text><rect x="570" y="290" width="170" height="90" rx="12" fill="#1E2C3A" stroke="#1E2C3A" stroke-width="1.6"/><text x="655" y="322" font-size="24" fill="#F6F4EE" font-weight="bold" text-anchor="middle">LLM call</text><text x="655" y="350" font-size="19" fill="#C9D1D9" text-anchor="middle">profile, transcript,</text><text x="655" y="372" font-size="19" fill="#C9D1D9" text-anchor="middle">memory, tool menu</text><rect x="780" y="290" width="170" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="865" y="322" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Tool needed?</text><text x="865" y="350" font-size="19" fill="#15202B" text-anchor="middle">yes → guarded run</text><text x="865" y="372" font-size="19" fill="#15202B" text-anchor="middle">no → answer</text><rect x="990" y="290" width="170" height="90" rx="12" fill="#A8560A" stroke="#A8560A" stroke-width="1.6"/><text x="1075" y="322" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">guarded_run</text><text x="1075" y="350" font-size="19" fill="#FBE9D2" text-anchor="middle">scope · confirmation</text><text x="1075" y="372" font-size="19" fill="#FBE9D2" text-anchor="middle">· eligibility</text><rect x="1200" y="290" width="170" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1285" y="322" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Tool runs</text><text x="1285" y="350" font-size="19" fill="#15202B" text-anchor="middle">orders · knowledge</text><text x="1285" y="372" font-size="19" fill="#15202B" text-anchor="middle">· tickets</text><rect x="1400" y="290" width="150" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1475" y="333" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Observation</text><text x="1475" y="361" font-size="19" fill="#15202B" text-anchor="middle">result appended</text><rect x="40" y="250" width="460" height="170" rx="8" fill="#FFFFFF" stroke="#C9C4B8" stroke-width="1.2"/><text x="56" y="293" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">Exits before the loop:</text><text x="56" y="317" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">• anonymous account question →</text><text x="56" y="341" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">  login gate: "please log in"</text><text x="56" y="365" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">• repeated public question →</text><text x="56" y="389" font-size="19" fill="#4A5261" font-style="italic" text-anchor="start">  cached reply, 0 model calls</text><rect x="540" y="530" width="210" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="645" y="562" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">7 · Output policy</text><text x="645" y="590" font-size="19" fill="#15202B" text-anchor="middle">mask any identifier the</text><text x="645" y="612" font-size="19" fill="#15202B" text-anchor="middle">tools did not produce</text><rect x="790" y="530" width="210" height="90" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="895" y="562" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">8 · Observability</text><text x="895" y="590" font-size="19" fill="#15202B" text-anchor="middle">log tokens, cost, latency;</text><text x="895" y="612" font-size="19" fill="#15202B" text-anchor="middle">check alert thresholds</text><rect x="1040" y="530" width="210" height="90" rx="12" fill="#ECE8DD" stroke="#C9C4B8" stroke-width="1.6"/><text x="1145" y="562" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">9 · Memory write</text><text x="1145" y="590" font-size="19" fill="#15202B" text-anchor="middle">what was learned about</text><text x="1145" y="612" font-size="19" fill="#15202B" text-anchor="middle">this customer</text><rect x="1290" y="530" width="270" height="90" rx="12" fill="#D9ECEF" stroke="#1F6B78" stroke-width="1.6"/><text x="1425" y="562" font-size="24" fill="#15202B" font-weight="bold" text-anchor="middle">Reply to the customer</text><text x="1425" y="590" font-size="19" fill="#15202B" text-anchor="middle">with the trace for the</text><text x="1425" y="612" font-size="19" fill="#15202B" text-anchor="middle">internals panel</text><path d="M250,85 L290,85" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M500,85 L540,85" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M750,85 L790,85" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1000,85 L1040,85" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1250,85 L1290,85" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1425,130 L1425,180 L620,180 L620,290" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M740,335 L780,335" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M950,335 L990,335" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1160,335 L1200,335" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1370,335 L1400,335" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1475,290 L1475,258 L700,258 L700,290" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><text x="1090" y="250" font-size="16" fill="#4A5261" text-anchor="middle" font-style="italic">back to the model with what it learned</text><path d="M865,380 L865,485 L645,485 L645,530" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><text x="905" y="470" font-size="16" fill="#4A5261" text-anchor="middle" font-style="italic">answer ready</text><path d="M750,575 L790,575" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1000,575 L1040,575" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M1250,575 L1290,575" fill="none" stroke="#4A5261" stroke-width="2.2" marker-end="url(#a4A5261)"/><path d="M895,130 L895,180 L270,180 L270,250" fill="none" stroke="#1F6B78" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a1F6B78)"/><path d="M270,420 L270,650 L1425,650 L1425,620" fill="none" stroke="#1F6B78" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a1F6B78)"/><text x="850" y="668" font-size="16" fill="#1F6B78" text-anchor="middle" font-style="italic">straight to the reply</text></svg>